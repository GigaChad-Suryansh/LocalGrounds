# Render blueprint (alternative to Fly.io). One instance only: rooms are kept in memory.
services:
  - type: web
    name: localgrounds
    runtime: docker
    plan: free # sleeps after ~15 min idle and drops in-memory rooms; change to starter for an always-on instance
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
